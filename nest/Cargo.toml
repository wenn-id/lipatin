[package]
name = "nest"
version = "0.1.0"
edition = "2024"

[lib]
name = "lipatin_nest"
crate-type = ["rlib", "cdylib"]

[dependencies]
geo = "0.33.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.12.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"

# the search is heavy enough that unoptimised tests take minutes
[profile.test]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
strip = true

# the browser build: a panic traps instead of unwinding, so the .wasm carries no unwind code
[profile.wasm]
inherits = "release"
panic = "abort"
